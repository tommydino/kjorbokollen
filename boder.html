<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Informasjon</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
    }
    .card {
      width: min(100%, 520px);
      background: white;
      border-radius: 24px;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff3cd;
      font-size: 38px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.15;
    }
    h2 {
      margin: 0 0 22px;
      font-size: 21px;
      font-weight: 600;
    }
    p {
      margin: 0 auto 14px;
      max-width: 430px;
      font-size: 18px;
      line-height: 1.5;
    }
    .small {
      margin-top: 24px;
      color: #6e6e73;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">⚠️</div>
    <h1>INFORMASJON</h1>
    <h2>Boder</h2>

    <p>Bruk nøkkel som er merket 4.</p>

    <p class="small">
      Skann NFC-taggen igjen for å åpne denne informasjonen.
    </p>
  </main>
</body>
</html>
